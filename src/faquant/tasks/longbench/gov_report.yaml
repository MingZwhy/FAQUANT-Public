task: faquant_longbench_gov_report
dataset_path: THUDM/LongBench
dataset_name: gov_report
dataset_kwargs:
  trust_remote_code: true
test_split: test
doc_to_text: "You are given a report by a government agency. Write a one-page summary of the report.\n\nReport:\n{{context}}\n\nNow, write a one-page summary of the report.\n\nSummary:"
doc_to_target: "{{answers}}"
process_results: !function metrics.get_rouge_with_score
generation_kwargs:
  max_gen_toks: 512
  temperature: 1
  do_sample: false
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
