task: faquant_longbench_dureader
dataset_path: THUDM/LongBench
dataset_name: dureader
dataset_kwargs:
  trust_remote_code: true
test_split: test
doc_to_text: "请基于给定的文章回答下述问题。\n\n文章：{{context}}\n\n请基于上述文章回答下面的问题。\n\n问题：{{input}}\n回答："
doc_to_target: "{{answers}}"
process_results: !function metrics.get_rouge_zh_with_score
generation_kwargs:
  max_gen_toks: 128
  temperature: 1
  do_sample: false
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
