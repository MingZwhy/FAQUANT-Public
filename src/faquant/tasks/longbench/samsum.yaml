task: faquant_longbench_samsum
dataset_path: THUDM/LongBench
dataset_name: samsum
dataset_kwargs:
  trust_remote_code: true
test_split: test
doc_to_text: "Summarize the dialogue into a few short sentences. The following are some examples.\n\n{{context}}\n\n{{input}}"
doc_to_target: "{{answers}}"
process_results: !function metrics.get_rouge_with_score
generation_kwargs:
  max_gen_toks: 128
  temperature: 1
  do_sample: false
  until: ["\n"]
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
