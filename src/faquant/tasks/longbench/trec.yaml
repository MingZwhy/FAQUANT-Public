task: faquant_longbench_trec
dataset_path: THUDM/LongBench
dataset_name: trec
dataset_kwargs:
  trust_remote_code: true
test_split: test
doc_to_text: "Please determine the type of the question below. Here are some examples of questions.\n\n{{context}}\n{{input}}"
doc_to_target: "{{answers}}"
process_results: !function metrics.get_classification_with_score
generation_kwargs:
  max_gen_toks: 64
  temperature: 1
  do_sample: false
  until: ["\n"]
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
