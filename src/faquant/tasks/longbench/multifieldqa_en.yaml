task: faquant_longbench_multifieldqa_en
dataset_path: THUDM/LongBench
dataset_name: multifieldqa_en
dataset_kwargs:
  trust_remote_code: true
test_split: test
doc_to_text: "Read the following text and answer briefly.\n\n{{context}}\n\nNow, answer the following question based on the above text, only give me the answer and do not output any other words.\n\nQuestion: {{input}}\nAnswer:"
doc_to_target: "{{answers}}"
process_results: !function metrics.get_qa_f1_with_score
generation_kwargs:
  max_gen_toks: 64
  temperature: 1
  do_sample: false
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
